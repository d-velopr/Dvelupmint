<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 300" width="370" height="300"
     role="img" aria-label="Illustrative site health figures at handover"
     font-family="Poppins, 'Century Gothic', Futura, 'Trebuchet MS', sans-serif">
  <title>Site health at handover, illustrative figures</title>
  <rect x="0" y="0" width="370" height="300" rx="23" fill="#27292a"/>

  <text x="28" y="38" fill="#ffffff" font-size="16" font-weight="700">Site health at handover</text>
  <text x="28" y="56" fill="#7d8385" font-size="10">Typical figures on a finished build</text>

  <!-- performance ring -->
  <circle cx="62" cy="110" r="28" fill="none" stroke="#34383a" stroke-width="8"/>
  <circle cx="62" cy="110" r="28" fill="none" stroke="#ec6090" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="172.4 175.9"
          transform="rotate(-90 62 110)"/>
  <text x="62" y="118" font-size="22" font-weight="700" fill="#ffffff"
        text-anchor="middle">98</text>

  <text x="110" y="102" font-size="10" font-weight="700" fill="#ec6090"
        letter-spacing="1.3">PERFORMANCE</text>
  <text x="110" y="120" font-size="10" fill="#7d8385">Lighthouse score, mobile</text>
  <text x="110" y="136" font-size="10" fill="#7d8385">Green across the board</text>

  <line x1="28" y1="160" x2="342" y2="160" stroke="#3f4345" stroke-width="1"/>

  <text x="28" y="186" font-size="9" font-weight="600" fill="#7d8385"
        letter-spacing="1.3">LOAD TIME</text>
  <text x="342" y="186" font-size="13" font-weight="700" fill="#ffffff"
        text-anchor="end">0.9s</text>
  <rect x="28" y="194" width="314" height="5" rx="2.5" fill="#34383a"/>
  <rect x="28" y="194" width="276" height="5" rx="2.5" fill="#ec6090"/>
  <text x="28" y="226" font-size="9" font-weight="600" fill="#7d8385"
        letter-spacing="1.3">UPTIME</text>
  <text x="342" y="226" font-size="13" font-weight="700" fill="#ffffff"
        text-anchor="end">99.9%</text>
  <rect x="28" y="234" width="314" height="5" rx="2.5" fill="#34383a"/>
  <rect x="28" y="234" width="311" height="5" rx="2.5" fill="#ec6090"/>
  <text x="28" y="266" font-size="9" font-weight="600" fill="#7d8385"
        letter-spacing="1.3">CONVERSIONS</text>
  <text x="342" y="266" font-size="13" font-weight="700" fill="#ffffff"
        text-anchor="end">+34%</text>
  <rect x="28" y="274" width="314" height="5" rx="2.5" fill="#34383a"/>
  <rect x="28" y="274" width="173" height="5" rx="2.5" fill="#ec6090"/>
</svg>
